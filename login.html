<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <title>Connexion — Freeshop</title>
  <style>
    :root {
      --bg: #f5f6f3;
      --paper: #fff;
      --ink: #19251f;
      --muted: #78837b;
      --line: #e8ece7;
      --green: #13764c;
      --green-dark: #0f5436;
      --lime: #c8f169;
      --red: #b34747;
      --red-bg: #fef2f2;
      --shadow: 0 16px 40px #18251b0d, 0 2px 6px #18251b05;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .auth-card {
      width: min(400px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 34px 30px;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.5px;
      margin-bottom: 24px;
    }
    .brandmark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #173e2b;
      color: var(--lime);
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -.6px;
      margin-bottom: 6px;
    }
    p {
      color: var(--muted);
      font-size: 12.5px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 11.5px;
      font-weight: 650;
      color: #3b4740;
      margin-bottom: 7px;
    }
    .input-wrap {
      position: relative;
    }
    input {
      width: 100%;
      border: 1px solid #dfe5df;
      background: #fff;
      border-radius: 10px;
      padding: 12px 42px 12px 13px;
      font-size: 13.5px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      border-color: #58a77c;
      box-shadow: 0 0 0 3px #e3f3e9;
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
    }
    .error-box {
      background: var(--red-bg);
      border: 1px solid #fee2e2;
      color: var(--red);
      border-radius: 9px;
      padding: 10px 13px;
      font-size: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      width: 100%;
      border: 1px solid var(--green);
      background: var(--green);
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-weight: 650;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 4px #105a3a22;
      transition: background .15s;
    }
    .btn:hover {
      background: var(--green-dark);
    }
    .btn:disabled {
      opacity: .6;
      cursor: default;
    }
    .foot {
      text-align: center;
      margin-top: 22px;
      font-size: 11px;
      color: #9aa49d;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="brand">
      <div class="brandmark">↗</div>
      <span>Collecte</span>
    </div>
    <h1>Accès sécurisé</h1>
    <p>Saisissez le mot de passe administrateur pour accéder à votre espace Freeshop.</p>

    <div id="error" class="error-box hidden">
      <span>●</span>
      <span id="error-msg">Mot de passe incorrect.</span>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="password">Mot de passe administrateur</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" required placeholder="••••••••••••" autofocus autocomplete="current-password">
          <button type="button" class="toggle-pwd" id="toggle" title="Afficher/masquer">👁</button>
        </div>
      </div>
      <button type="submit" class="btn" id="submit-btn">Se connecter</button>
    </form>

    <div class="foot">Freeshop · Espace protégé</div>
  </main>

  <script>
    const form = document.querySelector('#login-form');
    const pwd = document.querySelector('#password');
    const toggle = document.querySelector('#toggle');
    const btn = document.querySelector('#submit-btn');
    const errBox = document.querySelector('#error');
    const errMsg = document.querySelector('#error-msg');

    toggle.onclick = () => {
      const isPwd = pwd.type === 'password';
      pwd.type = isPwd ? 'text' : 'password';
      toggle.textContent = isPwd ? '🙈' : '👁';
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Connexion…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd.value })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error?.message || 'Mot de passe incorrect.');
        }
        window.location.href = '/';
      } catch (err) {
        errMsg.textContent = err.message;
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Se connecter';
        pwd.focus();
        pwd.select();
      }
    };
  </script>
</body>
</html>
